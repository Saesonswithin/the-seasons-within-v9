{% extends 'base.html' %}{% block content %}
<section class="settings-page"><div class="simple-head"><span>FREE COMMUNITY PROFILE</span><h1>Edit My Profile</h1><p>Your free community profile is simple: one profile picture and your Journey Story. Your Conscious Coordination profile is separate and optional.</p></div><form class="settings-card" method="post" enctype="multipart/form-data"><label>Profile picture<input type="file" name="photo" accept="image/*"></label><label>Headline<input name="profile_headline" value="{{user['profile_headline']}}"></label><label>City / area<input name="city" value="{{user['city']}}"></label><label>My Journey Story<textarea name="journey_story">{{user['journey_story'] or user['bio']}}</textarea></label><button class="btn">Save Community Profile</button><a class="btn outline" href="/dating-profile">Build / Edit Conscious Coordination Profile</a></form></section>
{% endblock %}
