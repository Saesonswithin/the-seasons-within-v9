{% extends 'base.html' %}{% block content %}<div class="settings-page"><div class="simple-head"><span>MY PROFILE</span><h1>Edit Basic Profile</h1><p>This is the information other community members may see.</p></div><form class="settings-card" method="post" enctype="multipart/form-data"><label>Profile Photo<input type="file" name="photo" accept="image/*"></label><label>Short Headline<input name="profile_headline" value="{{user['profile_headline']}}" placeholder="Yoga teacher • Nature lover • Community builder"></label><label>City<input name="city" value="{{user['city']}}"></label><label>About Me<textarea name="bio">{{user['bio']}}</textarea></label><div class="privacy-checks"><label><input type="checkbox" name="show_headline" {% if user['show_headline'] %}checked{% endif %}> Show headline</label><label><input type="checkbox" name="show_city" {% if user['show_city'] %}checked{% endif %}> Show city</label><label><input type="checkbox" name="show_bio" {% if user['show_bio'] %}checked{% endif %}> Show About Me</label><label><input type="checkbox" name="show_zodiac_basic" {% if user['show_zodiac_basic'] %}checked{% endif %}> Show Sun sign</label></div>{% if user['is_creator'] or user['is_admin'] %}<label>Publish a Seasons Within community post<textarea name="creator_post" placeholder="Write the Daily Seasons Within reflection or blog update..."></textarea></label>{% endif %}<button class="btn">Save Changes</button></form></div>{% endblock %}
