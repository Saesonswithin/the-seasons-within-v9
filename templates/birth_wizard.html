{% extends 'base.html' %}{% block content %}
<section class="settings-page"><div class="simple-head"><span>YOUR SEASONS WITHIN</span><h1>Create / Update My Natal Chart</h1><p>Your natal chart is the foundation of Conscious Coordination. Enter your real birth information so the app can calculate your placements.</p></div><form class="settings-card" method="post"><label>Date of birth<input type="date" name="birth_date" required value="{{birth['birth_date'] if birth else ''}}"></label><label>Time of birth<input type="time" name="birth_time" value="{{birth['birth_time'] if birth else ''}}"></label><label><input type="checkbox" name="time_known" {% if not birth or birth['time_known'] %}checked{% endif %}> I know my exact birth time</label><div class="two-fields"><label>City<input name="birth_city" required value="{{birth['birth_city'] if birth else ''}}"></label><label>State / region<input name="birth_state" value="{{birth['birth_state'] if birth else ''}}"></label></div><label>Country<input name="birth_country" required value="{{birth['birth_country'] if birth else 'USA'}}"></label><details class="advanced-box"><summary>Advanced Birth Location</summary><div class="two-fields"><label>Latitude<input name="latitude" value="{{birth['latitude'] if birth and birth['latitude'] is not none else ''}}"></label><label>Longitude<input name="longitude" value="{{birth['longitude'] if birth and birth['longitude'] is not none else ''}}"></label></div><label>Timezone<input name="timezone" value="{{birth['timezone'] if birth else ''}}" placeholder="America/Detroit"></label><label>UTC offset at birth<input name="utc_offset" value="{{birth['utc_offset'] if birth and birth['utc_offset'] is not none else ''}}"></label></details><button class="btn large">Calculate My Natal Chart</button></form></section>
{% endblock %}
