{% extends 'base.html' %}{% block content %}<div class="chat-page"><div class="chat-head"><a href="/messages">‹</a><div class="avatar-fallback">{{other['name'][:1]}}</div><div><h2>{{other['name']}}</h2><small>Member conversation</small></div></div><div class="chat-thread">{% for m in thread %}<div class="chat-bubble {% if m['sender_id']==current_user['id'] %}mine{% endif %}"><b>{{m['sender_name']}}</b><p>{{m['body']}}</p><small>{{m['created_at']}}</small></div>{% endfor %}</div><form class="chat-compose" method="post"><input name="body" placeholder="Type a message..." required><button class="btn">Send</button></form></div>{% endblock %}
